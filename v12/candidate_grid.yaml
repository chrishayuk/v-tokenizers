# TOK-1 candidate grid — frozen before any candidate trains (G1 input)
# 4 algorithms x 4 vocab sizes x 3 pre-tokenizations = 48 subword configs
# + pure byte (collapses the vocab-size axis, tracked as Branch B)
# + incumbent (v11 recovered SP, exempt from elimination)
# + 2-3 shadow-lane configs (instrument validation only, no survivor slot)

axes:
  algorithm: ["unigram_sp", "bpe_sp", "byte_level_bpe", "pure_byte"]
  core_vocab_size: [4000, 8000, 16000, 32000]
  pre_tokenization: ["whitespace_split", "digit_isolating", "code_aware"]

# The full 48-cell declaration remains historical/preregistered context. The
# next run is intentionally restricted to the six cells that can still answer
# a live decision. Implemented by training/train_structural_candidate.py.
tok2_selective_pre_tokenization:
  status: "implemented, not yet run"
  corpus: "C8 v3 (must be frozen before training)"
  vocab_size: 16000
  arms:
    - {id: "U16_whitespace_split_c8v3", algorithm: "unigram", pre_tokenization: "whitespace_split"}
    - {id: "U16_digit_isolating_c8v3", algorithm: "unigram", pre_tokenization: "digit_isolating"}
    - {id: "U16_code_aware_c8v3", algorithm: "unigram", pre_tokenization: "code_aware"}
    - {id: "B16_whitespace_split_c8v3", algorithm: "bpe", pre_tokenization: "whitespace_split"}
    - {id: "B16_digit_isolating_c8v3", algorithm: "bpe", pre_tokenization: "digit_isolating"}
    - {id: "B16_code_aware_c8v3", algorithm: "bpe", pre_tokenization: "code_aware"}
  invariant: "training and runtime use the same serializable tokenizer.json pre-tokenizer"
  structural_profile:
    evaluator: "training/evaluate_structural_profile.py"
    probes: "targets/structural_profile.jsonl"
    metrics: ["boundary_precision", "boundary_recall", "atomic_span_rate", "mean_identifier_or_unit_fragmentation", "context_sequence_preservation_rate", "roundtrip_rate"]

digit_policy: "C6 — single-char digits on every subword candidate"

ablation:
  ABL_1:
    base: "best TOK-1 survivor's config"
    variant: "atomic multi-digit instead of single-char"
    stage: "TOK-2a"
    can_win: false
    prices: "P1' — the digit-interface tax"

branch_b_pure_byte:
  tracked_as: "independent branch, not part of the 4x4x3 grid"
  vocab_axis: "collapsed (byte-level, ~256 base symbols)"
  msi_strict: "≈1.0 by construction — no canonicalization burden"

incumbent:
  id: "v11_ws_exact"
  source: "training/v11_ws_exact_manifest.json"
  base_source: "../v11/artifacts/tokenizer.json"
  vocab_total: 71260
  exempt_from_elimination: true

shadow_lane_configs:
  # PIN: not yet decided — 2-3 deliberately below-floor configs (MSI-canonical
  # below MSI_canonical_min), ideally within an otherwise-matched family.
  # Occupy no survivor slots; train only at TOK-2c's smaller mini-ladder size.
  - id: null
    family: null
    note: "TBD at TOK-0 pin finalization"
  - id: null
    family: null
    note: "TBD at TOK-0 pin finalization"
