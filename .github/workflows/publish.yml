name: Release (manual)

# Manual-only release pipeline for v11 -- crates.io, PyPI, and HuggingFace
# Hub. Never fires automatically (workflow_dispatch only) and refuses to do
# anything unless the confirm input is typed exactly. Each destination is
# its own job behind the same guard, and independently toggleable, so a
# single run can target just one of them if that's all you need.
#
# v12 is deliberately NOT included here -- it's an active, pre-registered
# research funnel (see v12/pins/tok0_pins.yaml) and stays unpublished until
# a candidate wins the funnel.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CARGO_REGISTRY_TOKEN  -- crates.io API token, for publish_crates
#   PYPI_TOKEN            -- PyPI API token, for publish_pypi (maturin-action
#                            reads it via MATURIN_PYPI_TOKEN)
#   HF_TOKEN              -- HuggingFace write-access token, for publish_hf
# None of these exist yet as of this workflow's authoring -- set them
# before the first real dispatch, `gh secret set NAME` (run it yourself,
# so the value never appears in any chat/transcript) is the simplest way.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm you mean to actually publish v11'
        required: true
      hf_repo_id:
        description: "HuggingFace repo id to push the tokenizer to (replaces its contents)"
        required: true
        default: "chrishayuk/v11-tokenizer"
      publish_crates:
        description: "Publish to crates.io (v11-core, v11-builder, v11-cli, in that order)"
        type: boolean
        default: true
      publish_pypi:
        description: "Publish to PyPI (v11-python, via maturin)"
        type: boolean
        default: true
      publish_hf:
        description: "Publish the tokenizer to HuggingFace Hub"
        type: boolean
        default: true
      publish_datasets:
        description: "Publish the v11 corpus to HuggingFace Hub as a dataset repo"
        type: boolean
        default: true
      hf_corpus_repo_id:
        description: "HuggingFace DATASET repo id for the v11 gate corpus"
        required: true
        default: "chrishayuk/v11-corpus"
      publish_wordnet:
        description: "Also publish the WordNet lemma extraction (check the Princeton WordNet licence first -- off by default)"
        type: boolean
        default: false
      hf_wordnet_repo_id:
        description: "HuggingFace DATASET repo id for the WordNet lemma extraction"
        required: false
        default: "chrishayuk/v11-wordnet-lemmas"

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: require explicit confirmation
        if: ${{ github.event.inputs.confirm != 'publish' }}
        run: |
          echo "Confirmation input did not match 'publish' -- stopping without publishing anything."
          exit 1

  # Ordering matters: v11-builder/v11-cli/v11-python all depend on v11-core
  # via { path = "../core", version = "0.1.0" } (needed so `cargo publish`
  # works at all -- path-only deps are rejected). Until v11-core is actually
  # live on the index, publishing any dependent crate fails with "no
  # matching package named `v11-core` found" (verified via `cargo publish
  # --dry-run` 2026-07-24) -- publish v11-core first, poll the sparse index
  # until it's actually there, then the rest.
  publish-crates:
    needs: guard
    if: ${{ github.event.inputs.publish_crates == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish v11-core, v11-builder, v11-cli (in order, idempotent)
        # Sparse-index paths are NOT /v1/crates/{name} (that's the separate
        # crates.io web API) -- they're derived from name length: 1 char ->
        # 1/{name}, 2 char -> 2/{name}, 3 char -> 3/{first-char}/{name}, 4+
        # char -> {first-2}/{next-2}/{name}. Got this wrong the first time
        # (used the web-API shape), which made a genuinely successful
        # v11-core publish look like a failure (real 2026-07-24 run). Skip-
        # if-already-published makes this safe to redispatch after a partial
        # failure, since `cargo publish` errors on a version that already
        # exists.
        run: |
          set -euo pipefail

          sparse_path() {
            local name="$1" len=${#1}
            if [ "$len" -eq 1 ]; then echo "1/$name"
            elif [ "$len" -eq 2 ]; then echo "2/$name"
            elif [ "$len" -eq 3 ]; then echo "3/${name:0:1}/$name"
            else echo "${name:0:2}/${name:2:2}/$name"
            fi
          }

          wait_for_index() {
            local name="$1" path
            path=$(sparse_path "$name")
            for i in $(seq 1 30); do
              if curl -fsS "https://index.crates.io/${path}" >/dev/null 2>&1; then
                echo "$name is live on the index"
                return 0
              fi
              echo "$name not yet indexed, waiting (attempt $i/30)..."
              sleep 10
            done
            echo "$name never appeared on the index after 5 minutes" >&2
            return 1
          }

          publish_if_needed() {
            local name="$1" path
            path=$(sparse_path "$name")
            if curl -fsS "https://index.crates.io/${path}" >/dev/null 2>&1; then
              echo "$name already published, skipping"
            else
              cargo publish -p "$name" --token "${CARGO_REGISTRY_TOKEN}"
              wait_for_index "$name"
            fi
          }

          publish_if_needed v11-core
          publish_if_needed v11-builder
          publish_if_needed v11-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Independent of publish-crates: maturin builds v11-python from source via
  # its own path dep on v11-core, it doesn't need v11-core from the registry.
  publish-pypi:
    needs: guard
    if: ${{ github.event.inputs.publish_pypi == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # maturin-action has no python-version input; it builds against
      # whatever `python3` resolves to on PATH. GitHub's macos-latest
      # default is 3.14, newer than PyO3 0.22's max supported 3.13
      # ("the configured Python interpreter version (3.14) is newer than
      # PyO3's maximum supported version (3.13)", real failure 2026-07-24)
      # -- pin explicitly rather than bump PyO3 blind.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: publish
          args: --skip-existing -m v11/python/Cargo.toml
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-hf:
    needs: guard
    if: ${{ github.event.inputs.publish_hf == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install publish deps
        run: pip install --quiet "huggingface_hub>=0.24" "transformers>=4.44" "tokenizers>=0.20" "pyyaml>=6"
      # Goes through scripts/publish_tokenizer.py rather than a raw
      # upload_folder, because the upload is the easy part. That script
      # enforces the things that actually matter and that a plain push cannot:
      # it refuses to overwrite a repo whose tokenizer.json hashes differently
      # (immutability as a precondition, not a README promise), pins
      # tokenizer_class so BOTH transformers 4.x and 5.x can load the result
      # (5.x alone writes a config 4.x rejects outright), ships the dormant-block
      # declaration and golden encodings, and re-loads the DOWNLOADED artifact
      # to replay every golden vector before reporting success.
      - name: publish the v11 tokenizer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 scripts/publish_tokenizer.py \
            --tokenizer-json v11/artifacts/tokenizer.json \
            --repo-id "${{ github.event.inputs.hf_repo_id }}" \
            --status adopted \
            --source-commit "${{ github.sha }}" \
            --dataset-name v11/tokenizer \
            --dataset-version v1

  # ---------------------------------------------------------------------------
  # Datasets -> HuggingFace Hub (repo_type="dataset", not "model").
  #
  # Only the corpus is on by default. It is hand-written prose and code written
  # for this repo, and it is the corpus the byte-safety round-trip gate is
  # measured against -- publishing it is what makes "0 UNK, 32/32 pass" a claim
  # anyone can re-run.
  #
  # The WordNet extraction is a separate, default-OFF toggle: it is derived from
  # Princeton WordNet, which carries its own licence, and redistributing a
  # derivative is a decision for a human rather than a workflow default.
  # ---------------------------------------------------------------------------
  publish-datasets:
    needs: guard
    if: ${{ github.event.inputs.publish_datasets == 'true' || github.event.inputs.publish_wordnet == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install huggingface_hub
        run: pip install --quiet "huggingface_hub>=0.24"

      - name: push the v11 gate corpus
        if: ${{ github.event.inputs.publish_datasets == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ github.event.inputs.hf_corpus_repo_id }}
        run: |
          python3 - <<'PYEOF'
          import os, pathlib
          from huggingface_hub import HfApi

          root = pathlib.Path("v11/corpus")
          files = sorted(p for p in root.rglob("*") if p.is_file())
          card = f"""---
          license: apache-2.0
          language: [en]
          tags: [tokenizer, evaluation, round-trip]
          ---

          # v11 tokenizer gate corpus

          {len(files)} files of prose and source code, hand-assembled to exercise a
          tokenizer where real text does: indentation, tabs, operators, Greek
          letters, maths symbols, and non-ASCII characters.

          This is the corpus the [v11 tokenizer](https://huggingface.co/chrishayuk/v11-tokenizer)
          round-trip gate runs against. Current result: **0 UNK, 32/32 files
          round-trip exactly**.

          It exists because an earlier check against three samples of plain English
          prose passed cleanly while the tokenizer was in fact dropping 662
          characters on real input -- it never contained a tab. A gate corpus is
          only worth what its hardest file is worth.

          Registered in the chuk-datasets catalog as `v11/corpus`; its content
          identity is verified against that catalog on every CI run.

          ## Layout

          ```
          prose/   science, history, tech, geography
          code/    c, go, java, javascript, python, rust, typescript
          ```
          """
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_REPO_ID"]
          api.create_repo(repo_id, repo_type="dataset", exist_ok=True)
          pathlib.Path("README.md.corpus").write_text(card)
          api.upload_file(path_or_fileobj="README.md.corpus", path_in_repo="README.md",
                          repo_id=repo_id, repo_type="dataset")
          api.upload_folder(
              folder_path=str(root), path_in_repo="", repo_id=repo_id,
              repo_type="dataset", delete_patterns=["prose/*", "code/*"],
              commit_message="v11 gate corpus (0 UNK, 32/32 round-trip pass)",
          )
          print(f"pushed {len(files)} files to {repo_id}")
          PYEOF

      - name: push the WordNet lemma extraction
        if: ${{ github.event.inputs.publish_wordnet == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ github.event.inputs.hf_wordnet_repo_id }}
        run: |
          python3 - <<'PYEOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_REPO_ID"]
          api.create_repo(repo_id, repo_type="dataset", exist_ok=True)
          api.upload_file(
              path_or_fileobj="v11/data/wordnet_lemmas.json",
              path_in_repo="wordnet_lemmas.json",
              repo_id=repo_id, repo_type="dataset",
              commit_message="WordNet lemmas filtered at min Zipf 2.5 (27,796 of 77,174)",
          )
          print(f"pushed wordnet_lemmas.json to {repo_id}")
          PYEOF
