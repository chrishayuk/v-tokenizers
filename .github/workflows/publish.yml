name: Release (manual)

# Manual-only release pipeline for v11 -- crates.io, PyPI, and HuggingFace
# Hub. Never fires automatically (workflow_dispatch only) and refuses to do
# anything unless the confirm input is typed exactly. Each destination is
# its own job behind the same guard, and independently toggleable, so a
# single run can target just one of them if that's all you need.
#
# v12 is deliberately NOT included here -- it's an active, pre-registered
# research funnel (see v12/pins/tok0_pins.yaml) and stays unpublished until
# a candidate wins the funnel.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CARGO_REGISTRY_TOKEN  -- crates.io API token, for publish_crates
#   PYPI_TOKEN            -- PyPI API token, for publish_pypi (maturin-action
#                            reads it via MATURIN_PYPI_TOKEN)
#   HF_TOKEN              -- HuggingFace write-access token, for publish_hf
# All three are set and have been used for real releases (0.1.0 2026-07-24,
# 0.1.1 2026-07-25).
# If one ever needs rotating, `gh secret set NAME` (run it yourself, so the
# value never appears in any chat/transcript) is the simplest way.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm you mean to actually publish v11 (not needed for a dry run)'
        required: false
      dry_run:
        description: "Rehearse: build and package everything, upload nothing, tag nothing"
        type: boolean
        default: false
      hf_repo_id:
        description: "HuggingFace repo id to push the tokenizer to (replaces its contents)"
        required: true
        default: "chrishayuk/v11-tokenizer"
      publish_crates:
        description: "Publish to crates.io (v11-core, v11-builder, v11-cli, in that order)"
        type: boolean
        default: true
      publish_pypi:
        description: "Publish to PyPI (v11-python, via maturin)"
        type: boolean
        default: true
      publish_hf:
        description: "Publish the tokenizer to HuggingFace Hub"
        type: boolean
        default: true
      publish_datasets:
        description: "Publish the v11 corpus to HuggingFace Hub as a dataset repo"
        type: boolean
        default: true
      hf_corpus_repo_id:
        description: "HuggingFace DATASET repo id for the v11 gate corpus"
        required: true
        default: "chrishayuk/v11-corpus"
      publish_wordnet:
        description: "Also publish the WordNet lemma extraction (check the Princeton WordNet licence first -- off by default)"
        type: boolean
        default: false
      hf_wordnet_repo_id:
        description: "HuggingFace DATASET repo id for the WordNet lemma extraction"
        required: false
        default: "chrishayuk/v11-wordnet-lemmas"

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      # A dry run uploads nothing, so demanding the confirmation word for one
      # would only train people to type it without reading it.
      - name: require explicit confirmation
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.confirm != 'publish' }}
        run: |
          echo "Confirmation input did not match 'publish' -- stopping without publishing anything."
          echo "(Dispatch with dry_run=true to rehearse without typing it.)"
          exit 1
      - name: say which mode this is
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "::notice::DRY RUN -- everything builds and packages, nothing uploads, nothing is tagged"
          else
            echo "::notice::LIVE RUN -- this publishes"
          fi

  # Ordering matters: v11-builder/v11-cli/v11-python all depend on v11-core
  # with both a path and a version (needed so `cargo publish` works at all --
  # path-only deps are rejected; the version lives in [workspace.dependencies]
  # in the root Cargo.toml, and v11/python carries its own copy because it is
  # workspace-excluded). Until v11-core is actually
  # live on the index, publishing any dependent crate fails with "no
  # matching package named `v11-core` found" (verified via `cargo publish
  # --dry-run` 2026-07-24) -- publish v11-core first, poll the sparse index
  # until it's actually there, then the rest.
  publish-crates:
    needs: guard
    if: ${{ github.event.inputs.publish_crates == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Rehearsal: ONE `cargo package` naming all three crates, with full
      # verification (no --no-verify). Packaging them in a single invocation is
      # what makes that possible. Cargo stages the crates being packaged into a
      # temporary local registry (target/package/tmp-registry) and verifies each
      # one against THAT, so v11-builder/v11-cli build against the v11-core
      # .crate this run just produced instead of against the index.
      #
      # This job used to do it per-crate, which cannot work for an unreleased
      # version: packaging v11-builder alone resolves `v11-core = "^<new>"`
      # against crates.io, where the new version by definition does not exist
      # yet, and fails with "failed to select a version for the requirement".
      # `--no-verify` does not avoid it -- it skips the build, not the
      # dependency resolution that writes the packaged Cargo.lock.
      #
      # The old shape passed twice on 2026-07-25 and still looked healthy,
      # because both of those rehearsals ran at 0.1.1 while 0.1.1 was already
      # live on the index -- so the resolution it could not survive never
      # happened. It failed the first time it was asked to rehearse a version
      # that was actually unreleased (0.1.2), which is the only case a
      # rehearsal exists for. A dry run that can only rehearse already-shipped
      # versions is not a dry run.
      - name: dry run -- package and verify all three
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "would publish version ${VERSION}"

          cargo package -p v11-core -p v11-builder -p v11-cli

          echo "packaged and verified, nothing uploaded:"
          ls -la target/package/*.crate
          test "$(ls target/package/*.crate | wc -l)" -eq 3 \
            || { echo "::error::expected 3 .crate files"; exit 1; }

          # Assert the archives carry the version this run claims. Packaging
          # cannot currently produce a differently-named .crate, but the point
          # of the rehearsal is that its verdict is checked rather than
          # inferred -- the 0.1.1 release went green having published nothing.
          for name in v11-core v11-builder v11-cli; do
            test -f "target/package/${name}-${VERSION}.crate" \
              || { echo "::error::no ${name}-${VERSION}.crate"; exit 1; }
          done

      - name: publish v11-core, v11-builder, v11-cli (in order, idempotent)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        # Sparse-index paths are NOT /v1/crates/{name} (that's the separate
        # crates.io web API) -- they're derived from name length: 1 char ->
        # 1/{name}, 2 char -> 2/{name}, 3 char -> 3/{first-char}/{name}, 4+
        # char -> {first-2}/{next-2}/{name}. Got this wrong the first time
        # (used the web-API shape), which made a genuinely successful
        # v11-core publish look like a failure (real 2026-07-24 run).
        #
        # The skip check must be per-VERSION, not per-crate. It originally
        # asked only whether the crate had an index file at all, which is true
        # forever once the first version ships -- so the 0.1.1 release skipped
        # all three crates, published nothing, and reported success (real
        # 2026-07-25 run; PyPI shipped 0.1.1 while crates.io stayed on 0.1.0).
        # An index file is newline-delimited JSON, one object per version, so
        # the honest question is whether THIS version's object is in it.
        run: |
          set -euo pipefail

          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "publishing version ${VERSION}"

          sparse_path() {
            local name="$1" len=${#1}
            if [ "$len" -eq 1 ]; then echo "1/$name"
            elif [ "$len" -eq 2 ]; then echo "2/$name"
            elif [ "$len" -eq 3 ]; then echo "3/${name:0:1}/$name"
            else echo "${name:0:2}/${name:2:2}/$name"
            fi
          }

          # No pipe on purpose. `curl ... | grep -q` looks natural but is a
          # trap under `set -o pipefail`: grep exits at the first match and
          # closes the pipe, curl dies of SIGPIPE, and the pipeline reports
          # failure on the SUCCESS path -- i.e. it would republish a version
          # that is already live. Capture the body, then match it.
          version_on_index() {
            local name="$1" path body
            path=$(sparse_path "$name")
            body=$(curl -fsS --retry 3 --retry-connrefused \
                     "https://index.crates.io/${path}" 2>/dev/null) || return 1
            case "$body" in
              (*"\"vers\":\"${VERSION}\""*) return 0 ;;
              (*) return 1 ;;
            esac
          }

          wait_for_index() {
            local name="$1"
            for i in $(seq 1 30); do
              if version_on_index "$name"; then
                echo "$name ${VERSION} is live on the index"
                return 0
              fi
              echo "$name ${VERSION} not yet indexed, waiting (attempt $i/30)..."
              sleep 10
            done
            echo "$name ${VERSION} never appeared on the index after 5 minutes" >&2
            return 1
          }

          publish_if_needed() {
            local name="$1"
            if version_on_index "$name"; then
              echo "$name ${VERSION} already published, skipping"
            else
              cargo publish -p "$name" --token "${CARGO_REGISTRY_TOKEN}"
              wait_for_index "$name"
            fi
          }

          publish_if_needed v11-core
          publish_if_needed v11-builder
          publish_if_needed v11-cli

          # Assert the outcome rather than trusting the control flow above.
          # The bug this replaces was invisible precisely because every step
          # "succeeded" -- a release that publishes nothing must fail loudly.
          for name in v11-core v11-builder v11-cli; do
            if ! version_on_index "$name"; then
              echo "::error::${name} ${VERSION} is not on the index after publishing"
              exit 1
            fi
            echo "verified ${name} ${VERSION} on the index"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Independent of publish-crates: maturin builds v11-python from source via
  # its own path dep on v11-core, it doesn't need v11-core from the registry.
  publish-pypi:
    needs: guard
    if: ${{ github.event.inputs.publish_pypi == 'true' }}
    # One leg per platform, not per interpreter: v11-python builds against
    # PyO3's stable ABI (abi3-py39), so each wheel covers every Python >= 3.9.
    # 0.1.0 shipped exactly one wheel -- cp312 macosx_11_0_arm64 -- because
    # this job was a single macos-latest run, which meant `pip install
    # v11-tokenizer` on Linux, Windows, Intel Macs, or any non-3.12 Python
    # fell through to the sdist and needed a Rust toolchain to build it. Full
    # target triples rather than maturin-action's short aliases, so the runner
    # and the target can never disagree about what "aarch64" means.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # maturin-action has no python-version input; it builds against
      # whatever `python3` resolves to on PATH. GitHub's macos-latest
      # default is 3.14, newer than PyO3 0.22's max supported 3.13
      # ("the configured Python interpreter version (3.14) is newer than
      # PyO3's maximum supported version (3.13)", real failure 2026-07-24)
      # -- pin explicitly rather than bump PyO3 blind. Under abi3 this
      # interpreter only decides what PyO3 compiles against, not which
      # Pythons the resulting wheel is installable on.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Linux legs build inside a manylinux container that maturin-action
      # pulls itself, with no retry. A quay.io timeout ("context deadline
      # exceeded") failed the x86_64 leg mid-release on 2026-07-25 and, because
      # tag-release requires that no job failed, silently cost the release its
      # tag -- a registry blip presenting as a failed release. Pre-pulling with
      # backoff means the action's own pull hits the local cache.
      #
      # If maturin-action ever changes its default image this pre-pull simply
      # warms an image nobody uses: wasted seconds, not a regression, and the
      # unretried pull behaves exactly as it does today.
      - name: pre-pull the manylinux image (retry on transient registry failure)
        if: ${{ matrix.manylinux_image != '' }}
        run: |
          set -euo pipefail
          image="${{ matrix.manylinux_image }}:latest"
          for i in 1 2 3 4 5; do
            if docker pull "$image"; then
              echo "pulled $image on attempt $i"
              exit 0
            fi
            wait=$((i * 15))
            echo "pull failed (attempt $i/5), retrying in ${wait}s..."
            sleep "$wait"
          done
          echo "::error::could not pull $image after 5 attempts -- registry looks genuinely down"
          exit 1

      # Rehearsal: build every wheel, upload none. This is the check that would
      # have caught 0.1.0's PyO3-vs-Python-3.14 mismatch before it consumed a
      # release, and it is the only way to exercise all five targets without
      # spending a version number.
      - name: dry run -- build the wheel, upload nothing
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release -m v11/python/Cargo.toml
      - name: dry run -- show what was built
        if: ${{ github.event.inputs.dry_run == 'true' }}
        shell: bash
        run: ls -la target/wheels/ || ls -la v11/python/target/wheels/

      # --skip-existing is what makes the whole matrix redispatchable: every
      # leg also emits an identical sdist, and the first one to land wins
      # instead of the other four failing on "file already exists".
      - uses: PyO3/maturin-action@v1
        if: ${{ github.event.inputs.dry_run != 'true' }}
        with:
          command: publish
          target: ${{ matrix.target }}
          manylinux: auto
          args: --skip-existing --non-interactive -m v11/python/Cargo.toml
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  publish-hf:
    needs: guard
    if: ${{ github.event.inputs.publish_hf == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install publish deps
        run: pip install --quiet "huggingface_hub>=0.24" "transformers>=4.44" "tokenizers>=0.20" "pyyaml>=6"
      # Goes through scripts/publish_tokenizer.py rather than a raw
      # upload_folder, because the upload is the easy part. That script
      # enforces the things that actually matter and that a plain push cannot:
      # it refuses to overwrite a repo whose tokenizer.json hashes differently
      # (immutability as a precondition, not a README promise), pins
      # tokenizer_class so BOTH transformers 4.x and 5.x can load the result
      # (5.x alone writes a config 4.x rejects outright), ships the dormant-block
      # declaration and golden encodings, and re-loads the DOWNLOADED artifact
      # to replay every golden vector before reporting success.
      - name: publish the v11 tokenizer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 scripts/publish_tokenizer.py \
            --tokenizer-json v11/artifacts/tokenizer.json \
            --vocab-bin v11/artifacts/v11.vocab.bin \
            --repo-id "${{ github.event.inputs.hf_repo_id }}" \
            --status adopted \
            --source-commit "${{ github.sha }}" \
            --dataset-name v11/tokenizer \
            --dataset-version v1 \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

  # ---------------------------------------------------------------------------
  # Datasets -> HuggingFace Hub (repo_type="dataset", not "model").
  #
  # Only the corpus is on by default. It is hand-written prose and code written
  # for this repo, and it is the corpus the byte-safety round-trip gate is
  # measured against -- publishing it is what makes "0 UNK, 32/32 pass" a claim
  # anyone can re-run.
  #
  # The WordNet extraction is a separate, default-OFF toggle: it is derived from
  # Princeton WordNet, which carries its own licence, and redistributing a
  # derivative is a decision for a human rather than a workflow default.
  # ---------------------------------------------------------------------------
  publish-datasets:
    needs: guard
    if: ${{ github.event.inputs.publish_datasets == 'true' || github.event.inputs.publish_wordnet == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install huggingface_hub
        run: pip install --quiet "huggingface_hub>=0.24"

      # Goes through scripts/publish_dataset.py rather than a raw upload_folder
      # for the same reason the tokenizer does: the upload is the easy part.
      # `upload_folder` then `print("pushed")` reports success on the strength
      # of the request being accepted, which is a different claim from "the
      # bytes a reader downloads are the bytes I meant to publish". This
      # pipeline has already shipped two releases where every job went green
      # while something had silently not happened, so the script downloads
      # every file back at the resulting revision and sha256-compares it
      # against the working tree before reporting success.
      #
      # The card lives in scripts/cards/ rather than a heredoc here, so it can
      # be reviewed and diffed without reading YAML.
      - name: push the v11 gate corpus
        if: ${{ github.event.inputs.publish_datasets == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 scripts/publish_dataset.py \
            --root v11/corpus \
            --repo-id "${{ github.event.inputs.hf_corpus_repo_id }}" \
            --card scripts/cards/v11-corpus.md \
            --commit-message "v11 gate corpus (0 UNK, 32/32 round-trip pass)" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # --allow-extra: this repo is a single file rather than a mirrored tree,
      # so anything else already in it is not evidence of a partial upload.
      - name: push the WordNet lemma extraction
        if: ${{ github.event.inputs.publish_wordnet == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 scripts/publish_dataset.py \
            --root v11/data/wordnet_lemmas.json \
            --repo-id "${{ github.event.inputs.hf_wordnet_repo_id }}" \
            --allow-extra \
            --commit-message "WordNet lemmas filtered at min Zipf 2.5 (27,796 of 77,174)" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

  # ---------------------------------------------------------------------------
  # Tag the commit that was actually released.
  #
  # 0.1.0 shipped to all three registries with no tag behind it, so nothing in
  # git said which tree the published bytes came from -- and it was not one
  # tree: v11-core and the PyPI wheel went out from 60ab7c2, v11-builder and
  # v11-cli from its child 8f9c942, after a partial failure was redispatched.
  # Reconstructing that needed the Actions run log, which expires. A tag per
  # release keeps the answer in the repo.
  #
  # Runs last and only if nothing failed. Skipped publish jobs are fine (a
  # single-destination dispatch is a normal thing to do), so this checks for
  # the absence of failure rather than the presence of success.
  # ---------------------------------------------------------------------------
  tag-release:
    needs: [guard, publish-crates, publish-pypi, publish-hf, publish-datasets]
    if: >-
      ${{ always()
          && github.event.inputs.dry_run != 'true'
          && needs.guard.result == 'success'
          && !contains(needs.*.result, 'failure')
          && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag this commit with the workspace version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          tag="v${version}"
          echo "workspace version: ${version}"

          # Idempotent: redispatching after a partial failure must not fail
          # here, and must not silently move an existing tag onto a new commit.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing=$(git rev-list -n1 "${tag}")
            if [ "${existing}" = "${GITHUB_SHA}" ]; then
              echo "${tag} already points at ${GITHUB_SHA}, nothing to do"
              exit 0
            fi
            echo "::error::${tag} already exists and points at ${existing}, not ${GITHUB_SHA}." \
                 "Bump the version in Cargo.toml rather than re-releasing under a used tag."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "v-tokenizers ${tag}

          Released by workflow run ${GITHUB_RUN_ID}.

          crates.io:    ${{ github.event.inputs.publish_crates }}
          PyPI:         ${{ github.event.inputs.publish_pypi }}
          HF tokenizer: ${{ github.event.inputs.publish_hf }} (${{ github.event.inputs.hf_repo_id }})
          HF corpus:    ${{ github.event.inputs.publish_datasets }} (${{ github.event.inputs.hf_corpus_repo_id }})
          HF wordnet:   ${{ github.event.inputs.publish_wordnet }}"
          git push origin "${tag}"
          echo "tagged ${GITHUB_SHA} as ${tag}"
